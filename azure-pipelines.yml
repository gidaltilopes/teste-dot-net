trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'

  # Discord webhook (coloque como secret depois!)
  DISCORD_WEBHOOK: 'https://discord.com/api/webhooks/1486600130986639391/jxMZrXnyAOugCfbcr8h_4JvSMmOQ4AwHseyG0bU5wbqt2a1CDThX3EmZhqbKUUotQ5Ht'

  # SonarQube Cloud
  sonarServiceConnection: 'sc-sonarcloud'
  sonarOrganization: 'gidaltilopes'
  sonarProjectKey: 'gidaltilopes_teste-dot-net'
  sonarProjectName: 'teste-dot-net'

  # Container / ACR
  dockerRegistryServiceConnection: 'sc-acr'
  containerRegistry: 'testedotnet.azurecr.io'
  imageRepository: 'teste-dot-net'
  imageTag: '$(Build.BuildId)'

  # Azure / AKS
  azureSubscription: 'sc-azure'
  aksResourceGroup: 'resource1'
  aksClusterName: 'aksdev'
  kubernetesNamespace: 'default'

  # Paths
  solution: 'HelloFunctionApp.sln'
  appProject: 'HelloFunctionApp.csproj'
  testProjects: 'tests/HelloFunctionApp.Tests/HelloFunctionApp.Tests.csproj'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

stages:

- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    steps:
    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

- stage: Test
  displayName: 'Test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TestJob
    steps:
    - checkout: self

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: SonarCloudPrepare@4
      inputs:
        SonarCloud: '$(sonarServiceConnection)'
        organization: '$(sonarOrganization)'
        scannerMode: 'dotnet'
        projectKey: '$(sonarProjectKey)'
        projectName: '$(sonarProjectName)'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'test'
        projects: '$(testProjects)'
        arguments: '--configuration $(buildConfiguration) --no-build'
        publishTestResults: true

    - task: SonarCloudAnalyze@4

    - task: SonarCloudPublish@4
      inputs:
        pollingTimeoutSec: '300'

- stage: Package
  displayName: 'Package and Push'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: DockerJob
    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Build and push image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        arguments: '--platform linux/arm64'
        tags: |
          $(imageTag)
          latest

- stage: CD_DEV
  displayName: 'Deploy to AKS DEV'
  dependsOn: Package
  condition: succeeded()
  jobs:
  - deployment: DeployToAks
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: KubernetesManifest@1
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: '$(azureSubscription)'
              azureResourceGroup: '$(aksResourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              namespace: '$(kubernetesNamespace)'
              manifests: |
                $(Build.SourcesDirectory)/k8s/deployment.yaml
                $(Build.SourcesDirectory)/k8s/service.yaml
                $(Build.SourcesDirectory)/k8s/ingress.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(imageTag)

# ✅ SUCESSO
- stage: Notify_Success
  displayName: 'Notify Discord Success'
  dependsOn: CD_DEV
  condition: succeeded()
  jobs:
  - job: Notify
    steps:
    - script: |
        curl -H "Content-Type: application/json" \
        -X POST \
        -d "{
          \"content\": \"✅ SUCCESS\nBuild: $(Build.BuildId)\nBranch: $(Build.SourceBranchName)\nRepo: $(Build.Repository.Name)\n🔗 $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)\"
        }" \
        $(DISCORD_WEBHOOK)

# ❌ FALHA
- stage: Notify_Failure
  displayName: 'Notify Discord Failure'
  dependsOn: CD_DEV
  condition: failed()
  jobs:
  - job: Notify
    steps:
    - script: |
        curl -H "Content-Type: application/json" \
        -X POST \
        -d "{
          \"content\": \"❌ FAILED\nBuild: $(Build.BuildId)\nBranch: $(Build.SourceBranchName)\nRepo: $(Build.Repository.Name)\n🔗 $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)\"
        }" \
        $(DISCORD_WEBHOOK)