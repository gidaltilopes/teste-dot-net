trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '8.0.x'


  # SonarQube Cloud
  sonarServiceConnection: 'sc-sonarcloud'
  sonarOrganization: 'gidaltilopes'
  sonarProjectKey: 'gidaltilopes_teste-dot-net'
  sonarProjectName: 'teste-dot-net'

  # Container / ACR
  dockerRegistryServiceConnection: 'sc-acr'
  containerRegistry: 'testedotnet.azurecr.io'
  imageRepository: 'teste-dot-net'
  imageTag: '$(Build.BuildId)'

  # Azure / AKS
  azureSubscription: 'sc-azure'
  aksResourceGroup: 'resource1'
  aksClusterName: 'aksdev'
  kubernetesNamespace: 'default'

  # Paths
  solution: 'HelloFunctionApp.sln'
  appProject: 'HelloFunctionApp.csproj'
  testProjects: 'tests/HelloFunctionApp.Tests/HelloFunctionApp.Tests.csproj'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: BuildJob
    displayName: 'Restore and Build'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Use .NET SDK 8'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

- stage: Test
  displayName: 'Test'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TestJob
    displayName: 'Run Tests with Coverage'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Use .NET SDK 8'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: 'restore'
        projects: '$(solution)'

    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarQube Cloud analysis'
      inputs:
        SonarCloud: '$(sonarServiceConnection)'
        organization: '$(sonarOrganization)'
        scannerMode: 'dotnet'
        projectKey: '$(sonarProjectKey)'
        projectName: '$(sonarProjectName)'
        extraProperties: |
          sonar.cs.vstest.reportsPaths=$(Agent.TempDirectory)/**/*.trx
          sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'Test with coverage'
      inputs:
        command: 'test'
        projects: '$(testProjects)'
        arguments: '--configuration $(buildConfiguration) --no-build /p:CollectCoverage=true /p:CoverletOutputFormat=opencover'
        publishTestResults: true

    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarQube Cloud analysis'

    - task: SonarCloudPublish@4
      displayName: 'Publish Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

- stage: Package
  displayName: 'Package and Push'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: DockerJob
    displayName: 'Build and Push Docker Image'
    steps:
    - checkout: self
      fetchDepth: 0

    - task: Docker@2
      displayName: 'Build and push image to ACR'
      inputs:
        command: 'buildAndPush'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        arguments: '--platform linux/arm64'
        tags: |
          $(imageTag)
          latest

- stage: CD_DEV
  displayName: 'Deploy to AKS DEV'
  dependsOn: Package
  condition: succeeded()
  jobs:
  - deployment: DeployToAks
    displayName: 'Deploy app on AKS'
    environment: 'dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: KubernetesManifest@1
            displayName: 'Deploy manifests'
            inputs:
              action: 'deploy'
              connectionType: 'azureResourceManager'
              azureSubscriptionConnection: '$(azureSubscription)'
              azureResourceGroup: '$(aksResourceGroup)'
              kubernetesCluster: '$(aksClusterName)'
              namespace: '$(kubernetesNamespace)'
              manifests: |
                $(Build.SourcesDirectory)/k8s/deployment.yaml
                $(Build.SourcesDirectory)/k8s/service.yaml
                $(Build.SourcesDirectory)/k8s/ingress.yaml
              containers: |
                $(containerRegistry)/$(imageRepository):$(imageTag)